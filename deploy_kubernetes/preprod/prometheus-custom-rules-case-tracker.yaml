apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: civil-appeal-case-tracker-preprod
  labels:
    role: alert-rules
  name: prometheus-custom-rules-civil-appeal-case-tracker-preprod
spec:
  groups:
    - name: application-rules
      rules:
        # Uses the built-in Actuator/Micrometer request metric rather than a
        # custom counter: a 5xx response is by definition an unhandled
        # exception, and the exception/uri labels come for free.
        - alert: application_exception_alert
          expr: increase(http_server_requests_seconds_count{namespace="civil-appeal-case-tracker-preprod",status=~"5.."}[5m]) > 0
          for: 0m
          labels:
            severity: civil-appeal-case-tracker-preprod
          annotations:
            message: "civil-appeal-case-tracker-preprod has an unhandled exception ({{ $labels.exception }}) in {{ $labels.uri }} on pod {{ $labels.pod }}"
            runbook_url: "http://my-support-docs"
            dashboard_url: "http://my-dashboard"

        # Scheduled tasks have no HTTP request, so application_exception_alert
        # cannot see them fail. Counter comes from @Counted(recordFailuresOnly).
        - alert: scheduled_task_exception_alert
          expr: increase(scheduled_task_exceptions_total{namespace="civil-appeal-case-tracker-preprod"}[1h]) > 0
          for: 0m
          labels:
            severity: civil-appeal-case-tracker-preprod
          annotations:
            message: "civil-appeal-case-tracker-preprod scheduled task {{ $labels.method }} failed ({{ $labels.exception }}) on pod {{ $labels.pod }} - case data may be stale"
            runbook_url: "http://my-support-docs"
            dashboard_url: "http://my-dashboard"
